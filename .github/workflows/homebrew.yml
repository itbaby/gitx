name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  update-formula:
    runs-on: macos-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: itbaby/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}

      - name: Install Xcode Gen
        if: false  # Only needed if regenerating project
        run: echo "Skipping Xcode Gen install"

      - name: Get release info
        id: release
        run: |
          TAG_NAME=${{ github.event.inputs.tag || github.event.release.tag_name }}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download macOS (Intel) DMG
        run: |
          curl -L -o gitx-intel.dmg \
            "https://github.com/itbaby/gitx/releases/download/${{ steps.release.outputs.tag }}/GitX_${{ steps.release.outputs.version }}_x86_64.dmg"

      - name: Download macOS (Apple Silicon) DMG
        run: |
          curl -L -o gitx-arm64.dmg \
            "https://github.com/itbaby/gitx/releases/download/${{ steps.release.outputs.tag }}/GitX_${{ steps.release.outputs.version }}_aarch64.dmg"

      - name: Download Linux .deb
        run: |
          curl -L -o gitx-linux.deb \
            "https://github.com/itbaby/gitx/releases/download/${{ steps.release.outputs.tag }}/gitx_${{ steps.release.outputs.version }}_amd64.deb"

      - name: Calculate SHA256 checksums
        id: shas
        run: |
          echo "intel=$(shasum -a 256 gitx-intel.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "arm64=$(shasum -a 256 gitx-arm64.dmg | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux=$(shasum -a 256 gitx-linux.deb | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update Formula
        working-directory: homebrew-tap
        run: |
          VERSION=${{ steps.release.outputs.version }}
          TAG=${{ steps.release.outputs.tag }}
          INTEL_SHA=${{ steps.shas.outputs.intel }}
          ARM64_SHA=${{ steps.shas.outputs.arm64 }}
          LINUX_SHA=${{ steps.shas.outputs.linux }}
          ruby -e '
            path = "Formula/gitx.rb"
            content = File.read(path)
            content.sub!(/version ".*"/, "version \"" + ENV["VERSION"] + "\"")
            content.gsub!(%r{https://github.com/itbaby/gitx/releases/download/[^/]+/GitX}, "https://github.com/itbaby/gitx/releases/download/" + ENV["TAG"] + "/GitX")
            content.gsub!(%r{https://github.com/itbaby/gitx/releases/download/[^/]+/gitx}, "https://github.com/itbaby/gitx/releases/download/" + ENV["TAG"] + "/gitx")
            content.sub!(/X86_64_SHA256_PLACEHOLDER/, ENV["INTEL_SHA"])
            content.sub!(/ARM64_SHA256_PLACEHOLDER/, ENV["ARM64_SHA"])
            content.sub!(/LINUX_SHA256_PLACEHOLDER/, ENV["LINUX_SHA"])
            File.write(path, content)
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5.0.2
        with:
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}
          commit-message: "Update gitx to ${{ steps.release.outputs.version }}"
          title: "Update gitx to ${{ steps.release.outputs.version }}"
          body: |
            ## Summary
            Automated update of gitx Homebrew formula to version ${{ steps.release.outputs.version }}

            ## Changes
            - Updated version to ${{ steps.release.outputs.version }}
            - Updated download URLs
            - Updated SHA256 checksums

            This PR was created by the [Update Homebrew Formula](https://github.com/itbaby/gitx/actions/workflows/homebrew.yml) workflow.
          branch: update-gitx-${{ steps.release.outputs.version }}
          delete-branch: true
